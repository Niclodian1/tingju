<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-title" content="逐句精听">
  <meta name="description" content="中英双语逐句精听学习器。请使用你自己合法持有的音频和字幕。">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>逐句精听</title>
  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-secondary: #1e293b;
      --bg-card: #1e293b;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent: #38bdf8;
      --border-color: #334155;
      --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: var(--font-stack);
      line-height: 1.5;
      padding: 22px 16px 40px;
      max-width: 640px;
      margin: 0 auto;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand img {
      width: 44px;
      height: 44px;
      border-radius: 10px;
    }

    header h1 {
      font-size: 1.3rem;
      font-weight: 700;
    }

    header .sub {
      color: var(--text-secondary);
      font-size: 0.8rem;
      margin-top: 6px;
    }

    .grid {
      display: grid;
      gap: 14px;
      margin-top: 18px;
    }

    .movie-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 16px;
    }

    .movie-card h2 {
      font-size: 1.05rem;
      font-weight: 700;
    }

    .movie-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      font-size: 0.75rem;
      color: var(--text-secondary);
      margin: 8px 0 14px;
    }

    .tag {
      background: rgba(56, 189, 248, 0.12);
      color: var(--accent);
      border-radius: 6px;
      padding: 2px 7px;
    }

    .movie-actions { display: flex; gap: 10px; }

    .btn {
      flex: 1;
      display: block;
      text-align: center;
      padding: 10px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: none;
    }

    .btn-primary { background: var(--accent); color: #0f172a; }
    .btn-primary:active { opacity: 0.85; }
    .btn-secondary {
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--accent);
    }

    .empty {
      text-align: center;
      color: var(--text-secondary);
      padding: 48px 0;
      font-size: 0.9rem;
      line-height: 2;
    }

    footer {
      margin-top: 28px;
      font-size: 0.72rem;
      color: var(--text-secondary);
      line-height: 1.7;
    }

    footer code {
      background: var(--bg-secondary);
      border-radius: 4px;
      padding: 1px 5px;
      font-size: 0.7rem;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <img src="apple-touch-icon.png" alt="" width="44" height="44" onerror="this.style.display='none'">
      <div>
        <h1>逐句精听</h1>
        <p class="sub">共 <span id="count">0</span> 篇 · 点击卡片进入逐句精听</p>
      </div>
    </div>
  </header>

  <main class="grid" id="grid"></main>

  <footer>
    用手机 Safari 打开本页即可学习，可点底部分享 →「添加到主屏幕」。<br>
    请使用你自己合法持有的音频与字幕。本站不提供、也不存储他人影视作品。
  </footer>

  <script>
    /* __LIBRARY_DATA_START__ */
    let library = [];
    /* __LIBRARY_DATA_END__ */

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }

    const grid = document.getElementById("grid");
    document.getElementById("count").textContent = library.length + 1;

    if (!library.length) {
      grid.innerHTML = '<div class="empty">书架还是空的<br>用 tools/build_offline_pack.py 打包第一篇课文，或在学习页导入自己的音频和字幕</div>';
    } else {
      library
        .slice()
        .sort((a, b) => String(b.builtAt || "").localeCompare(String(a.builtAt || "")))
        .forEach((m) => {
          const card = document.createElement("div");
          card.className = "movie-card";
          const offsetValue = Number(m.offset || 0);
          const offsetText = `${offsetValue >= 0 ? "+" : ""}${offsetValue.toFixed(2)}s`;
          const builtText = String(m.builtAt || "").slice(0, 10);
          card.innerHTML = `
            <h2>${escapeHtml(m.title || m.id)}</h2>
            <div class="movie-meta">
              <span class="tag">${Number(m.lines || 0)} 句</span>
              <span class="tag">偏移 ${offsetText}</span>
              <span>${escapeHtml(builtText)}</span>
            </div>
            <div class="movie-actions">
              <a class="btn btn-primary" href="movies/${encodeURIComponent(m.id)}/${encodeURIComponent(m.htmlFile || "learning.html")}">开始学习</a>
            </div>
          `;
          grid.appendChild(card);
        });
    }

    const importCard = document.createElement("div");
    importCard.className = "movie-card";
    importCard.innerHTML = `
      <h2>导入我的课文</h2>
      <div class="movie-meta">
        <span class="tag">音频 + 字幕</span>
        <span>自己的材料在手机上逐句跟读</span>
      </div>
      <div class="movie-actions">
        <a class="btn btn-secondary" href="movies/demo/learning.html?import=1">导入音频和字幕</a>
      </div>
    `;
    grid.appendChild(importCard);
  </script>
</body>
</html>
